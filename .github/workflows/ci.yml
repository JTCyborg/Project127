name: Project127 build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test TR-DOS image builder
        run: python -m unittest discover -s tests -v
      - name: Build SjASMPlus
        run: |
          git clone --depth 1 --recursive https://github.com/z00m128/sjasmplus.git /tmp/sjasmplus
          make -C /tmp/sjasmplus -j2
      - name: Assemble and create TR-DOS disk
        run: |
          mkdir -p build
          /tmp/sjasmplus/sjasmplus --cleanonerror --raw=build/p127_boot.bin src/boot/p127_boot.asm
          python tools/trd_image.py --code build/p127_boot.bin --output build/Project127.trd
      - uses: actions/upload-artifact@v4
        with:
          name: Project127-TRD
          path: build/Project127.trd
