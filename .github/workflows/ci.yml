name: Project127 build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build SjASMPlus
        run: |
          git clone --depth 1 --recursive https://github.com/z00m128/sjasmplus.git /tmp/sjasmplus
          make -C /tmp/sjasmplus -j2

      - name: Assemble complete Project127 TR-DOS image
        run: |
          mkdir -p build
          /tmp/sjasmplus/sjasmplus --cleanonerror --dirbol --lst=build/list.txt --sym=build/map.txt src/main.asm
          test -f disk_A.trd
          test "$(stat -c%s disk_A.trd)" -eq 655360
          cp disk_A.trd build/disk_A.trd

      - uses: actions/upload-artifact@v4
        with:
          name: Project127-TRD
          path: build/disk_A.trd
